<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Reparaciones - Joyería</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado Principal -->
  <header class="app-header">
    <div class="logo-area">
      <span class="icon">💎</span>
      <h1>Joyería & Relojería — Control de Reparaciones</h1>
    </div>
  </header>

  <!-- Contenido Principal dividido en 2 columnas -->
  <main class="main-container">
    
    <!-- Columna Izquierda: Formulario de Registro -->
    <section class="card form-section">
      <h2>📥 Nueva Reparación</h2>
      <p class="subtitle">Registra la entrada de una pieza al taller</p>

      <form id="formulario-reparacion">
        <div class="form-group">
          <label for="cliente">Nombre del Cliente *</label>
          <input type="text" id="cliente" placeholder="Ej. Ana García" required>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono / WhatsApp *</label>
          <input type="tel" id="telefono" placeholder="Ej. 612345678" required>
        </div>

        <div class="form-group">
          <label for="pieza">Pieza o Reloj *</label>
          <input type="text" id="pieza" placeholder="Ej. Reloj Seiko esfera azul / Anillo oro 18k" required>
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción del trabajo</label>
          <textarea id="descripcion" rows="3" placeholder="Ej. Cambio de cristal, pila y prueba de hermetismo..."></textarea>
        </div>

        <div class="form-group">
          <label for="precio">Precio Estimado (€)</label>
          <input type="number" id="precio" step="0.01" placeholder="0.00">
        </div>

        <button type="submit" class="btn btn-primary">➕ Registrar Entrada</button>
      </form>
    </section>

    <!-- Columna Derecha: Inventario y Lista -->
    <section class="card list-section">
      <div class="list-header">
        <div>
          <h2>📦 Inventario de Reparaciones</h2>
          <p class="subtitle">Piezas registradas y seguimiento de estados</p>
        </div>
      </div>

      <!-- Tabla / Lista de Reparaciones -->
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID / Entrada</th>
              <th>Cliente</th>
              <th>Telefono</th>
              <th>Pieza</th>
              <th>Descripción</th>
              <th>Precio</th>
              <th>Estado</th>
              <th>Entrada</th>
              <th>Salida</th>
            </tr>
          </thead>
          <tbody id="tabla-reparaciones">
            <!-- Aquí iremos insertando las filas desde JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

  </main>
  <!-- Modal Emergente para Editar -->
<div id="modal-editar" class="modal">
  <div class="modal-contenido">
    <h2>Editar Reparación</h2>
    <form id="formulario-editar">
      <input type="text" id="edit-cliente" placeholder="Nombre cliente">
      <input type="text" id="edit-telefono" placeholder="Teléfono">
      <input type="text" id="edit-pieza" placeholder="Pieza">
      <input type="text" id="edit-descripcion" placeholder="Descripción">
      <input type="number" id="edit-precio" placeholder="Precio (€)">
      
      <div class="modal-botones">
        <button type="submit">Guardar Cambios</button>
        <button type="button" id="btn-cancelar">Cancelar</button>
      </div>
    </form>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
